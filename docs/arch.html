<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CQRS architecture</title>
<style>body{margin:0;padding:16px;font-family:'Segoe UI',Arial,sans-serif;background:#fff;}svg{width:100%;height:auto;display:block;margin:0 auto;}</style>
</head>
<body>
<svg viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker>
  </defs>

  <!-- command side -->
  <rect x="60" y="60" width="340" height="140" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="230" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">command side (writes)</text>
  <text x="230" y="115" text-anchor="middle" font-size="11.5" fill="#475569">OrderCommandService</text>
  <text x="230" y="138" text-anchor="middle" font-size="11" fill="#64748b">create_order() · pay_order()</text>
  <rect x="100" y="155" width="260" height="30" rx="6" fill="#fff" stroke="#2563eb"/>
  <text x="230" y="175" text-anchor="middle" font-size="11" fill="#1d4ed8">write store (normalized)</text>

  <!-- query side -->
  <rect x="600" y="60" width="340" height="140" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
  <text x="770" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">query side (reads)</text>
  <text x="770" y="115" text-anchor="middle" font-size="11.5" fill="#166534">OrderQueryService</text>
  <text x="770" y="138" text-anchor="middle" font-size="11" fill="#64748b">order_detail() · orders_of_user()</text>
  <rect x="640" y="155" width="260" height="30" rx="6" fill="#fff" stroke="#16a34a"/>
  <text x="770" y="175" text-anchor="middle" font-size="11" fill="#15803d">read store (projection)</text>

  <!-- projection arrow -->
  <line x1="400" y1="130" x2="600" y2="130" stroke="#d97706" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="500" y="118" text-anchor="middle" font-size="11.5" fill="#92400e">project / sync</text>

  <text x="500" y="260" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">reads never touch the write store; writes shape the read projection</text>
</svg>
</body>
</html>
