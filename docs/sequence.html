<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CQRS sequence</title>
<style>body{margin:0;padding:16px;font-family:'Segoe UI',Arial,sans-serif;background:#fff;}svg{width:100%;height:auto;display:block;margin:0 auto;}</style>
</head>
<body>
<svg viewBox="0 0 1000 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#1d4ed8"/></marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/></marker>
  </defs>

  <g font-size="12" font-weight="700">
    <rect x="60" y="20" width="120" height="32" rx="8" fill="#fff7e6" stroke="#d97706"/><text x="120" y="41" text-anchor="middle" fill="#92400e">client</text>
    <rect x="260" y="20" width="150" height="32" rx="8" fill="#eff6ff" stroke="#2563eb"/><text x="335" y="41" text-anchor="middle" fill="#1d4ed8">command svc</text>
    <rect x="480" y="20" width="130" height="32" rx="8" fill="#fef3c7" stroke="#d97706"/><text x="545" y="41" text-anchor="middle" fill="#92400e">write store</text>
    <rect x="680" y="20" width="130" height="32" rx="8" fill="#f0fdf4" stroke="#16a34a"/><text x="745" y="41" text-anchor="middle" fill="#15803d">read store</text>
  </g>
  <g stroke="#cbd5e1" stroke-dasharray="4 4">
    <line x1="120" y1="52" x2="120" y2="390"/>
    <line x1="335" y1="52" x2="335" y2="390"/>
    <line x1="545" y1="52" x2="545" y2="390"/>
    <line x1="745" y1="52" x2="745" y2="390"/>
  </g>

  <text x="40" y="80" font-size="12" font-weight="700" fill="#0f172a">write path</text>
  <line x1="120" y1="100" x2="330" y2="100" stroke="#1d4ed8" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="225" y="94" text-anchor="middle" font-size="11" fill="#1e40af">create_order</text>
  <line x1="335" y1="125" x2="540" y2="125" stroke="#1d4ed8" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="437" y="119" text-anchor="middle" font-size="11" fill="#1e40af">save</text>
  <line x1="335" y1="150" x2="740" y2="150" stroke="#d97706" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="537" y="144" text-anchor="middle" font-size="11" fill="#92400e">project to read store</text>

  <text x="40" y="200" font-size="12" font-weight="700" fill="#0f172a">read path</text>
  <line x1="120" y1="220" x2="740" y2="220" stroke="#16a34a" stroke-width="1.4" marker-end="url(#arrG)"/>
  <text x="430" y="214" text-anchor="middle" font-size="11" fill="#15803d">orders_of_user (read store only)</text>
  <line x1="745" y1="250" x2="125" y2="250" stroke="#16a34a" stroke-width="1.4" marker-end="url(#arrG)"/>
  <text x="435" y="244" text-anchor="middle" font-size="11" fill="#15803d">return read model</text>

  <text x="400" y="320" text-anchor="middle" font-size="11.5" fill="#64748b">write and read are separate paths; read never blocks on write.</text>
</svg>
</body>
</html>
